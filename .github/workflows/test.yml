name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build project
      run: swift build -v
      
    - name: Run tests
      run: swift test -v
